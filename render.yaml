services:
  - type: web
    name: jarvis-web
    env: python
    buildCommand: "pip install -r requirements_render.txt"
    startCommand: "python server_headless.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: JARVIS_HOST
        value: "0.0.0.0"

databases:
  - name: jarvis-db
    databaseName: jarvis
    user: jarvis
